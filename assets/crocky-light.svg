@keyframes run{from{stroke-dashoffset:310}to{stroke-dashoffset:0}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.dash{display:none}.blink{animation:none}}
