<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t">
<title id="t">Crocky en números: más de 640 pruebas, 15 puertos, 37 migraciones y 4 canales hacia una sola cocina</title>
<style>
